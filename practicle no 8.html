
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CM25046</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow">

        <h1 class="text-2xl font-bold text-center mb-2">
            Student Registration
        </h1>

        <p class="text-center text-gray-500 mb-5">
            College Admission Portal
        </p>

        <form id="registrationForm">

            <!-- Name -->
            <label class="block mb-1">Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                class="w-full border p-2 rounded mb-1"
            >

            <p id="nameError" class="text-red-500 text-sm mb-3"></p>


            <!-- Email -->
            <label class="block mb-1">Email</label>

            <input
                type="text"
                id="email"
                placeholder="Enter your email"
                class="w-full border p-2 rounded mb-1"
            >

            <p id="emailError" class="text-red-500 text-sm mb-3"></p>


            <!-- Password -->
            <label class="block mb-1">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                class="w-full border p-2 rounded mb-1"
            >

            <p id="passwordError" class="text-red-500 text-sm mb-3"></p>


            <!-- Mobile -->
            <label class="block mb-1">Mobile Number</label>

            <input
                type="text"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                class="w-full border p-2 rounded mb-1"
            >

            <p id="mobileError" class="text-red-500 text-sm mb-3"></p>


            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700"
            >
                Register
            </button>

            <!-- Success Message -->
            <p
                id="successMessage"
                class="text-green-600 text-center mt-4 font-semibold"
            ></p>

        </form>

    </div>


    <!-- JavaScript -->
    <script>

        const form = document.getElementById("registrationForm");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Get values
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let mobile = document.getElementById("mobile").value.trim();

            let valid = true;

            // Clear old messages
            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("passwordError").textContent = "";
            document.getElementById("mobileError").textContent = "";
            document.getElementById("successMessage").textContent = "";


            // Name validation
            if (name === "") {

                document.getElementById("nameError").textContent =
                    "Name is required";

                valid = false;
            }


            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                document.getElementById("emailError").textContent =
                    "Email is required";

                valid = false;

            } else if (!emailPattern.test(email)) {

                document.getElementById("emailError").textContent =
                    "Enter a valid email";

                valid = false;
            }


            // Password validation
            if (password === "") {

                document.getElementById("passwordError").textContent =
                    "Password is required";

                valid = false;

            } else if (password.length < 6) {

                document.getElementById("passwordError").textContent =
                    "Password must be at least 6 characters";

                valid = false;
            }


            // Mobile validation
            let mobilePattern = /^[0-9]{10}$/;

            if (mobile === "") {

                document.getElementById("mobileError").textContent =
                    "Mobile number is required";

                valid = false;

            } else if (!mobilePattern.test(mobile)) {

                document.getElementById("mobileError").textContent =
                    "Enter a valid 10 digit mobile number";

                valid = false;
            }


            // Final result
            if (valid) {

                document.getElementById("successMessage").textContent =
                    "Registration Successful!";

                form.reset();
            }

        });

    </script>

</body>
</html>
